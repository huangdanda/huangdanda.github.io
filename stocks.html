<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>个股10年深度分析 · 2015–2024</title>
<style>
  :root{
    --blue:#2a78d6; --orange:#eb6834; --red:#e34948; --gray:#898781;
    --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --base:#c3c2b7;
    --surface:#fcfcfb; --page:#f9f9f7;
    --border:rgba(11,11,11,0.10);
    --good:#0ca30c; --amber:#b45309; --crit:#d03b3b;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      --blue:#3987e5; --orange:#d95926; --red:#e66767;
      --ink:#fff; --ink2:#c3c2b7;
      --grid:#2c2c2a; --base:#383835;
      --surface:#1a1a19; --page:#0d0d0d;
      --border:rgba(255,255,255,0.10);
      --good:#4ec25a; --amber:#f5a524; --crit:#ef8a8a;
    }
  }
  :root[data-theme="dark"]{
    --blue:#3987e5; --orange:#d95926; --red:#e66767;
    --ink:#fff; --ink2:#c3c2b7;
    --grid:#2c2c2a; --base:#383835;
    --surface:#1a1a19; --page:#0d0d0d;
    --border:rgba(255,255,255,0.10);
    --good:#4ec25a; --amber:#f5a524; --crit:#ef8a8a;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--page); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    line-height:1.6; font-size:15px; -webkit-text-size-adjust:100%;}
  .wrap{max-width:760px; margin:0 auto; padding:0 16px 80px;}
  header{padding:20px 0 4px;}
  header h1{font-size:22px; margin:0 0 4px;}
  header .sub{color:var(--ink2); font-size:13px; margin:0;}
  .note{color:var(--muted); font-size:12px; margin:12px 0 0; padding:6px 10px;
    border-left:3px solid var(--base); background:var(--surface); border-radius:4px;}

  .selector{position:sticky; top:0; z-index:50; background:var(--page);
    border-bottom:1px solid var(--border); margin:0 -16px; padding:10px 16px;
    display:flex; gap:6px; flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; backdrop-filter:blur(8px);}
  .selector button{flex:0 0 auto; padding:7px 13px; font-size:13px; font-weight:600;
    border:1px solid var(--border); background:var(--surface); color:var(--ink2);
    border-radius:999px; cursor:pointer; white-space:nowrap;}
  .selector button.active{background:var(--blue); color:#fff; border-color:var(--blue);}

  .stock-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:16px;}
  .stock-head .nm{font-size:22px; font-weight:700;}
  .stock-head .code{font-size:13px; color:var(--muted);}
  .stock-head .ind{font-size:12px; color:var(--ink2); background:var(--grid); border-radius:999px; padding:2px 10px;}

  .kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0;}
  .kpi{background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:11px 12px;}
  .kpi .lbl{font-size:11px; color:var(--ink2);}
  .kpi .num{font-size:20px; font-weight:650; margin-top:3px; font-variant-numeric:tabular-nums;}
  .kpi .num small{font-size:12px; color:var(--muted); font-weight:500;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 16px 14px; margin:14px 0;}
  .card h3{font-size:15px; margin:0 0 2px;}
  .card .desc{color:var(--ink2); font-size:12.5px; margin:0 0 10px;}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--ink2); margin:4px 0 10px;}
  .legend .sw{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px; vertical-align:-1px;}
  .legend .sw.line{width:16px; height:2px; border-radius:0; vertical-align:middle;}
  .chart-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .chart-scroll .inner{min-width:600px;}
  svg{display:block; width:100%; height:auto; overflow:visible;}
  .sector-name{font-size:13px; fill:var(--ink);}
  .val-label{font-size:12.5px; font-weight:600; fill:var(--ink);}
  .yr-label,.axis-label,.ref-label{font-size:12px; fill:var(--muted);}
  .grid-line{stroke:var(--grid); stroke-width:1;}
  .ref-line{stroke:var(--base); stroke-width:1.2; stroke-dasharray:5 4;}

  table{width:100%; border-collapse:collapse; font-size:12.5px; margin:8px 0 4px;}
  th,td{padding:7px 8px; text-align:right; border-bottom:1px solid var(--grid); font-variant-numeric:tabular-nums;}
  th:first-child,td:first-child{text-align:left;}
  th{color:var(--muted); font-weight:600; font-size:11.5px;}

  .analysis p{font-size:14px; margin:10px 0; line-height:1.7;}
  .analysis b{color:var(--blue);}
  .analysis .concl{background:var(--page); border-left:3px solid var(--good); border-radius:6px; padding:10px 14px; margin-top:14px;}
  .balnav{display:flex; align-items:center; justify-content:center; gap:14px; margin:12px 0 6px;}
  .balbtn{padding:7px 15px; font-size:13px; border:1px solid var(--border); background:var(--surface); color:var(--blue); border-radius:9px; cursor:pointer; font-weight:600;}
  .balyear{font-size:15px; font-weight:700; min-width:70px; text-align:center;}
  .warn{background:rgba(208,59,59,0.12); color:var(--red); border:1px solid rgba(208,59,59,0.35); border-radius:8px; padding:8px 12px; font-size:13px; margin:10px 0; line-height:1.5;}
  .cashwarn{background:rgba(235,104,52,0.12); color:var(--orange); border:1px solid rgba(235,104,52,0.35); border-radius:8px; padding:8px 12px; font-size:13px; margin:10px 0; line-height:1.5;}

  .sources{font-size:11.5px; color:var(--muted); margin-top:26px; line-height:1.7;}
  .foot{font-size:11px; color:var(--muted); margin-top:6px;}
  @media (max-width:600px){ .kpis{grid-template-columns:repeat(2,1fr);} }
</style>
</head>

<div class="wrap">
  <header>
    <h1>个股 10 年深度分析</h1>
    <p class="sub">2015–2024 业绩 · 估值 · 财务质量（数据来自 akshare 新浪/百度口径）</p>

  </header>
  <div class="selector" id="selector"></div>

  <p class="foot">分析为个人研究观点，非荐股；精确数请以公司年报为准。</p>
</div>

  const pts=hist.map(h=>h[1]<=yMax?[X(h[0]).toFixed(1),Y(h[1]).toFixed(1)]:null).filter(Boolean);
  if(pts.length>1){ s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${C.blue}" stroke-width="2"/>`; }
  if(d.curPE!=null){ s+=`<circle cx="${X(x1)}" cy="${Y(Math.min(d.curPE,yMax))}" r="5" fill="${C.red}" stroke="var(--surface)" stroke-width="1.5"><title>当前PE ${d.curPE}×（历史分位${d.curPct}%）</title></circle>`; }
  const ys=Math.ceil(x0), ye=Math.floor(x1), st=Math.max(1,Math.round((ye-ys)/6));
  for(let y=ys;y<=ye;y+=st){ s+=`<text class="yr-label" x="${X(y)}" y="${pt+ph+15}" text-anchor="middle">${y}</text>`; }
  s+=`<text class="axis-label" x="${pl-8}" y="${pt-2}" text-anchor="end">PE(倍)</text>`;
  s+=`</svg>`; el.innerHTML=s;
}

function chip(d){ return d.rating==='A'?'ok':(d.rating==='B'?'amber':'crit'); }

let curBal=null, curBalYear=null, curBalInd='';
function fmtYi(v){
  if(v>=10000) return (v/10000).toFixed(1)+'万亿';
  if(v>=100) return Math.round(v)+'亿';
  if(v>=1) return v.toFixed(1)+'亿';
  return v.toFixed(2)+'亿';
}
function balChartSvg(items){
  const isBank = curBalInd === '银行';
  let rows;
  if(isBank){
    rows = [
      ['现金及存放央行','现金','a', items['现金及存放央行']],
      ['发放贷款','贷款','a', items['发放贷款']],
      ['吸收存款','存款','l', items['吸收存款']],
      ['总负债','总负债','l', items['总负债']],
      ['股东权益','净资产','e', items['股东权益']],
    ];
  } else {
    const intangible = (items['无形资产']||0) + (items['商誉']||0);
    const advReceipt = items['预收款'] ?? items['合同负债'];
    rows = [
      ['现金','现金','a', items['现金']],
      ['应收款','应收款','a', items['应收款']],
      ['预付款','预付款','a', items['预付款']],
      ['存货','存货','a', items['存货']],
      ['其他流动资产','其他流动','a', items['其他流动资产']],
      ['长期投资','长期投资','a', items['长期投资']],
      ['固定资产','固定资产','a', items['固定资产']],
      ['无形/商誉','无形商誉','a', intangible],
      ['其他非流动资产','其他固定','a', items['其他非流动资产']],
      ['短期借款','短期借款','l', items['短期借款']],
      ['应付款','应付款','l', items['应付款']],
      ['预收款','预收款','l', advReceipt],
      ['薪酬','薪酬','l', items['薪酬']],
      ['其他流动负债','其他流动','l', items['其他流动负债']],
      ['长期借款','长期借款','l', items['长期借款']],
      ['其他非流动负债','其他非流动','l', items['其他非流动负债']],
    ];
  }
  const col = isBank ? {a:C.blue, l:C.orange, e:'#1baf7a'} : {a:C.blue, l:C.red};
  const vals = rows.map(r => r[3] ?? 0);
  const max = niceMax(Math.max(...vals)*1.15);
  const W=820, pl=46, pr=12, pt=40, pb=60, pw=W-pl-pr, ph=300-pt-pb;
  const Y = v => pt+ph-(v/max)*ph;
  const bw = pw/rows.length;
  const barW = Math.min(22, bw*0.5);
  let s=`<svg viewBox="0 0 ${W} 300" role="img">`;
  s+=`<text class="val-label" x="${pl+pw}" y="${pt-24}" text-anchor="end" style="font-size:14px">${curBalYear}年</text>`;
  for(let g=0;g<=4;g++){const v=max/4*g; s+=`<line class="grid-line" x1="${pl}" y1="${Y(v)}" x2="${pl+pw}" y2="${Y(v)}"/>`;
    s+=`<text class="axis-label" x="${pl-5}" y="${Y(v)+4}" text-anchor="end">${v>=10000?(v/10000).toFixed(0)+'万亿':Math.round(v)}</text>`;}
  rows.forEach((r,i)=>{
    const v = r[3] ?? 0, cx=pl+bw*i+bw/2, h=v/max*ph;
    s+=`<rect x="${cx-barW/2}" y="${Y(v)}" width="${barW}" height="${Math.max(v>0?2:0,h).toFixed(1)}" rx="2" fill="${col[r[2]]}"><title>${r[0]} ${fmtYi(v)}</title></rect>`;
    if(v>0){ s+=`<text class="axis-label" x="${cx}" y="${Y(v)-4}" text-anchor="middle" style="font-size:9px">${fmtYi(v)}</text>`; }
    s+=`<text class="axis-label" x="${cx}" y="${pt+ph+10}" text-anchor="end" transform="rotate(-45 ${cx} ${pt+ph+10})">${r[1]}</text>`;
  });
  s+=`</svg>`;
  return s;
}
function balStep(delta){
  if(!curBal || !curBal.order.length) return;
  let i=curBal.order.indexOf(curBalYear);
  if(i<0) i=curBal.order.length-1;
  i=Math.min(Math.max(i+delta,0),curBal.order.length-1);
  curBalYear=curBal.order[i];
  document.getElementById('bal-chart').innerHTML=balChartSvg(curBal.years[curBalYear]||{});
}

function valChartSvg(d){
  const v=d.val||{};
  if(v.range_low==null || v.range_high==null) return '<div class="axis-label">数据不足</div>';
  const low=v.range_low, high=v.range_high, cur=d.curPE;
  const lo=Math.min(low, cur??low)*0.92, hi=Math.max(high, cur??high)*1.06;
  const W=620, pl=24, pr=24, pw=W-pl-pr, H=74, cy=32;
  const X=v=>pl+(v-lo)/(hi-lo)*pw;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  s+=`<rect x="${X(low)}" y="${cy-9}" width="${Math.max(2,X(high)-X(low))}" height="18" rx="4" fill="rgba(42,120,214,0.14)"/>`;
  s+=`<line x1="${X(low)}" y1="${cy-13}" x2="${X(low)}" y2="${cy+13}" stroke="${C.blue}" stroke-width="2.5"/>`;
  s+=`<line x1="${X(high)}" y1="${cy-13}" x2="${X(high)}" y2="${cy+13}" stroke="${C.blue}" stroke-width="2.5"/>`;
  if(cur!=null){
    s+=`<circle cx="${X(cur)}" cy="${cy}" r="6" fill="${C.red}"><title>当前PE ${cur}×</title></circle>`;
    s+=`<text class="val-label" x="${X(cur)}" y="${cy-18}" text-anchor="middle">当前${cur}×</text>`;
  }
  s+=`<text class="axis-label" x="${X(low)}" y="${cy+26}" text-anchor="middle">下沿${low}×</text>`;
  s+=`<text class="axis-label" x="${X(high)}" y="${cy+26}" text-anchor="middle">上沿${high}×</text>`;
  s+=`</svg>`;
  return s;
}

function render(d){
  cur=d;
  const rateTxt={A:'A 重点关注',B:'B 关注',C:'C 谨慎'}[d.rating];
  const [fRev,lRev]=firstLast(d.rev), [fNp,lNp]=firstLast(d.np);
  const [pState,pClass]=peState(d.curPct ?? 50);
  const last3 = YEARS.slice(-3);
  const np3 = d.np.slice(-3), ocf3 = d.ocf.slice(-3);
  const cfMax = niceMax(Math.max(...np3.filter(v=>v!=null), ...ocf3.filter(v=>v!=null)));
  const v=d.val||{}, vLow=v.range_low, vHigh=v.range_high;
  let verdict;
  if(d.pe_distorted) verdict=`⚠️ 业绩大幅下滑（净利增速 ${d.latest_g??'—'}%），PE 失真，本估值区间仅供参考，请以净资产(PB)判断`;
  else if(vLow==null||vHigh==null) verdict='估值数据不足';
  else if(d.curPE<vLow) verdict=`当前PE ${d.curPE}× 低于合理区间下沿 ${vLow}×，处「低估」区间`;
  else if(d.curPE>vHigh) verdict=`当前PE ${d.curPE}× 高于合理区间上沿 ${vHigh}×，处「高估」区间（注意别买贵）`;
  else verdict=`当前PE ${d.curPE}× 落在合理区间 [${vLow}, ${vHigh}]× 内，估值合理`;

  let h=`
  <div class="stock-head">
    <span class="nm">${d.name}</span><span class="code">${d.code}</span>
    <span class="ind">${d.industry}</span>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="lbl">当前PE</div><div class="num">${d.curPE??'—'}<small>×</small></div></div>
    <div class="kpi"><div class="lbl">ROE(2024)</div><div class="num">${d.roe_now??'—'}<small>%</small></div></div>
    <div class="kpi"><div class="lbl">净现比</div><div class="num">${d.ncr??'—'}</div></div>
    <div class="kpi"><div class="lbl">净利CAGR</div><div class="num">${d.cagr??'—'}<small>%</small></div></div>
    <div class="kpi"><div class="lbl">2024净利增速</div><div class="num">${d.latest_g==null?'—':(d.latest_g>0?'+':'')+d.latest_g}<small>%</small></div></div>
    <div class="kpi"><div class="lbl">评级</div><div class="num" style="color:var(--good)">${rateTxt}</div></div>
  </div>

  <div class="card"><h3>营业收入 vs 市盈率（估值合理性）</h3>
    <p class="desc">左轴＝营业收入（柱，亿元），右轴＝市盈率（线，倍）。看营收增长的同时，估值是同步抬升还是提前透支/回落。</p>
    <div class="legend"><span><span class="sw" style="background:var(--blue)"></span>营业收入</span><span><span class="sw line" style="background:var(--orange)"></span>市盈率(年均)</span></div>
    <div class="chart-scroll"><div class="inner"><div id="c0"></div></div></div></div>

  <div class="card"><h3>营收 vs 净利润（亿元）</h3>
    <div class="legend"><span><span class="sw" style="background:var(--blue)"></span>营业收入</span><span><span class="sw" style="background:var(--orange)"></span>归母净利润</span></div>
    <div class="chart-scroll"><div class="inner"><div id="c1"></div></div></div></div>

  <div class="card"><h3>市盈率（PE）全历史走势 · 估值区间</h3>
    ${d.pe_distorted ? `<div class="warn">⚠️ <b>PE 失真</b>：最新净利增速 ${d.latest_g??'—'}%，业绩大幅下滑导致 PE 被动抬升，当前 PE 不能反映真实估值，请改用<b>净资产（PB）/其他指标</b>判断。</div>` : ''}
    <p class="desc">当前 PE ${d.curPE??'—'} 倍，处历史 ${d.curPct??'—'}% 分位 → <b>${pState}</b>（&lt;30% 低估，30–70% 合理，&gt;70% 高估）。</p>
    <div class="legend"><span><span class="sw line" style="background:var(--blue)"></span>PE曲线</span><span><span class="sw" style="background:rgba(42,120,214,0.25)"></span>低估区</span><span><span class="sw" style="background:rgba(227,73,72,0.25)"></span>高估区</span><span><span class="sw" style="background:var(--red)"></span>当前</span></div>
    <div class="chart-scroll"><div class="inner"><div id="c2"></div></div></div></div>

  <div class="card"><h3>估值区间（绝对 + 相对 交叉对比）</h3>
    <p class="desc">5 个方法给出的合理 PE，取最小→最大为合理区间。当前 PE 低于下沿=便宜，高于上沿=买贵了。</p>
    <div class="chart-scroll"><table>
      <thead><tr><th>维度</th><th>方法</th><th class="num">合理PE</th></tr></thead><tbody>
        <tr><td>相对</td><td>历史PE分位</td><td class="num">${v.hist_low??'—'}–${v.hist_high??'—'}×</td></tr>
        <tr><td>相对</td><td>PEG（增速）</td><td class="num">${v.peg_pe??'—'}×</td></tr>
        <tr><td>绝对</td><td>现金流折现 DCF</td><td class="num">${v.dcf_pe??'—'}×</td></tr>
        <tr><td>绝对</td><td>股利折现 DDM</td><td class="num">${v.ddm_pe??'—'}×</td></tr>
        <tr><td>绝对</td><td>净资产法 PB-ROE</td><td class="num">${v.nav_pe??'—'}×</td></tr>
      </tbody></table></div>
    <div id="val-chart"></div>
    <div class="analysis"><div class="concl">${verdict}</div></div>
  </div>

  <div class="card"><h3>净资产收益率（ROE，%）</h3>
    <p class="desc">ROE 均值 ${d.roe_avg??'—'}% · 当前 ${d.roe_now??'—'}%</p>
    <div class="chart-scroll"><div class="inner"><div id="c3"></div></div></div></div>

  <div class="card"><h3>经营现金流 vs 净利润（亿元，近3年）</h3>
    ${d.cash_warn ? `<div class="cashwarn">⚠️ <b>现金流质量偏弱</b>：最新净现比 ${d.latest_ncr??'—'}（经营现金流/净利润 &lt; 1），利润未充分转化为现金，多为应收账款占用，需关注回款。</div>` : ''}
    <div class="legend"><span><span class="sw" style="background:var(--blue)"></span>经营现金流净额</span><span><span class="sw" style="background:var(--orange)"></span>归母净利润</span></div>
    <div class="chart-scroll"><div class="inner"><div id="c4"></div></div></div></div>

  <div class="card"><h3>主营业务收入 vs 经营现金流（亿元，10年曲线）</h3>
    <p class="desc">两条曲线看收入增长是否同步带来真金白银。现金流长期明显低于收入，说明利润含金量不足。</p>
    <div class="legend"><span><span class="sw line" style="background:var(--blue)"></span>营业收入</span><span><span class="sw line" style="background:var(--orange)"></span>经营现金流</span></div>
    <div class="chart-scroll"><div class="inner"><div id="c5"></div></div></div></div>

  <div class="card"><h3>近10年数据表</h3>
    <div class="chart-scroll"><table>
      <thead><tr><th>年份</th><th>营收(亿)</th><th>净利(亿)</th><th>净利增速</th><th>平均PE</th><th>年末PE</th><th>ROE%</th></tr></thead><tbody>
      ${YEARS.map((y,i)=>`<tr><td>${y}</td><td>${d.rev[i]??'—'}</td><td>${d.np[i]??'—'}</td>
        <td>${d.grow[i]==null?'—':(d.grow[i]>0?'+':'')+d.grow[i]+'%'}</td>
        <td>${d.peA[i]??'—'}</td><td>${d.peY[i]??'—'}</td><td>${d.roe[i]??'—'}</td></tr>`).join('')}
      </tbody></table></div></div>

  <div class="card"><h3>资产负债表（近5年，可切换年份）</h3>
    <p class="desc">单年度资产负债表结构：X轴为各科目，<b>蓝柱=资产（正向现金）</b>、<b>红柱=负债（负向现金）</b>，右上角为当期年度。点按钮切换上一年/下一年。</p>
    <div class="balnav"><button class="balbtn" onclick="balStep(-1)">◀ 上一年</button><button class="balbtn" onclick="balStep(1)">下一年 ▶</button></div>
    <div class="legend"><span><span class="sw" style="background:var(--blue)"></span>资产（正向现金）</span><span><span class="sw" style="background:var(--red)"></span>负债（负向现金）</span></div>
    <div class="chart-scroll"><div class="inner"><div id="bal-chart"></div></div></div></div>

  <div class="card"><h3>分析</h3><div class="analysis">
    <p><b>① 业绩：</b>营收 ${fRev[0]}亿(${fRev[1]})→${lRev[0]}亿(${lRev[1]})，净利 ${fNp[0]}亿(${fNp[1]})→${lNp[0]}亿(${lNp[1]})，复合增速 ${d.cagr??'—'}%；最新净利增速 ${d.latest_g==null?'—':(d.latest_g>0?'+':'')+d.latest_g}%。</p>
    <p><b>② 估值：</b>当前 PE ${d.curPE??'—'} 倍，处历史 ${d.curPct??'—'}% 分位，属<b>${pState}</b>；历史合理区间约 ${d.p30??'—'}–${d.p70??'—'} 倍。</p>
    <p><b>③ 质量：</b>ROE 均值 ${d.roe_avg??'—'}%、净现比 ${d.ncr??'—'}（利润转现金的能力）。</p>
    <p><b>④ 逻辑：</b>${d.logic}</p>
    <div class="concl"><b>增长潜力：</b>${d.growth}<br><b>主要风险：</b>${d.risk}</div>
  </div></div>`;

  document.getElementById('content').innerHTML=h;
  dual(document.getElementById('c0'),{
    bars:{name:'营业收入',color:C.blue,data:d.rev,unit:'亿'},
    line:{name:'市盈率(年均)',color:C.orange,data:d.peA,unit:'倍'},
    yMaxBar:niceMax(Math.max(...d.rev.filter(v=>v!=null))),
    yMaxLine:niceMax(Math.max(...d.peA.filter(v=>v!=null))*1.05)});
  grouped(document.getElementById('c1'),{yMax:niceMax(Math.max(...d.rev.filter(v=>v!=null))),unit:'亿',
    series:[{name:'营业收入',color:C.blue,data:d.rev},{name:'归母净利润',color:C.orange,data:d.np}]});
  peHist(document.getElementById('c2'), d);
  document.getElementById('val-chart').innerHTML = valChartSvg(d);
  lines(document.getElementById('c3'),{yMax:niceMax(Math.max(...d.roe.filter(v=>v!=null))*1.15),
    series:[{name:'ROE',color:C.blue,data:d.roe}]});
  grouped(document.getElementById('c4'),{yMax:cfMax,unit:'亿',years:last3,
    series:[{name:'经营现金流',color:C.blue,data:ocf3},{name:'净利润',color:C.orange,data:np3}]});
  lines(document.getElementById('c5'),{yMax:niceMax(Math.max(...d.rev.filter(v=>v!=null),...d.ocf.filter(v=>v!=null))*1.1),
    series:[{name:'营业收入',color:C.blue,data:d.rev},{name:'经营现金流',color:C.orange,data:d.ocf}]});
  curBal=d.balance||{years:{},order:[]};
  curBalInd=d.industry||'';
  curBalYear=curBal.order.length?curBal.order[curBal.order.length-1]:null;
  document.getElementById('bal-chart').innerHTML=curBalYear?balChartSvg(curBal.years[curBalYear]||{}):'';
}

function renderSelector(){
  const el=document.getElementById('selector');
  el.innerHTML=DATA.map(d=>`<button data-c="${d.code}">${d.name}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    el.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    render(DATA.find(x=>x.code===b.dataset.c));
  });
}

renderSelector();
document.querySelector('#selector button').click();
</script>
</body>
